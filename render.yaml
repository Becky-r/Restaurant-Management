services:
  - type: web
    name: restaurant-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: restaurant-db
    plan: free
